name: frr
description: FRR is free software that implements and manages various IPv4 and IPv6 routing protocols. It runs on nearly all distributions of Linux and BSD and supports all modern CPU architectures. The project website is frrouting.org.
FRR currently supports the following protocols:
BGP
OSPFv2
OSPFv3
RIPv1
RIPv2
RIPng
IS-IS
PIM (SM, DM, SSM, MSDP)
LDP
BFD
Babel
PBR
OpenFabric
VRRP
EIGRP (alpha)
NHRP (alpha)
type: public
upstream: https://github.com/FRRouting/frr
branches:
  - name: master
    type: protected
